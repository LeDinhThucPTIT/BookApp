name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: 'false'
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_USER: bookapp
      MYSQL_PASSWORD: bookapp-test-only
      MYSQL_DATABASE: bookapp
      JWT_SECRET_KEY: ci-test-only-not-for-deployment-change-this-value
      BOOKAPP_TEST_MYSQL: '1'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root-test-only
          MYSQL_DATABASE: bookapp
          MYSQL_USER: bookapp
          MYSQL_PASSWORD: bookapp-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot-test-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Import demo schema and data into the CI database
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import pymysql
          from pymysql.constants import CLIENT
          connection = pymysql.connect(
              host=os.environ['MYSQL_HOST'], user=os.environ['MYSQL_USER'],
              password=os.environ['MYSQL_PASSWORD'], database=os.environ['MYSQL_DATABASE'],
              charset='utf8mb4', autocommit=True, client_flag=CLIENT.MULTI_STATEMENTS,
          )
          try:
              with connection.cursor() as cursor:
                  cursor.execute(Path('bookapp.sql').read_text(encoding='utf-8'))
                  while cursor.nextset():
                      pass
          finally:
              connection.close()
          PY
      - run: python migrate.py
      - run: python -m unittest discover -s tests -v
